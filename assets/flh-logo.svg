<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" fill="none">
  <defs>
    <!-- Ambient Holographic Violet-Magenta Glass Gradient -->
    <radialGradient id="flhBgSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e1035" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090514" stop-opacity="0.95" />
    </radialGradient>

    <!-- Iridescent Border Gradient -->
    <linearGradient id="flhRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Ultra-Clean Diamond to Rose Gradient for Typography -->
    <linearGradient id="flhTextGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Soft Ambient Bloom Filter -->
    <filter id="flhTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#a855f7" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Frosted Glass Dark Orb -->
  <circle cx="22" cy="22" r="21" fill="url(#flhBgSphere)" stroke="url(#flhRim)" stroke-width="1.2" />

  <!-- Subtle Inner Glass Specular Ring -->
  <circle cx="22" cy="22" r="19" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.8" stroke-dasharray="1.5 2.5" />

  <!-- Top Specular Highlight Arc -->
  <path d="M 10 15 A 16 16 0 0 1 34 15" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1" stroke-linecap="round" />

  <!-- FLH Monogram Text -->
  <g filter="url(#flhTextGlow)">
    <text x="22" y="27" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="13.5" 
          font-weight="800" 
          letter-spacing="0.8px" 
          text-anchor="middle" 
          fill="url(#flhTextGrad)">FLH</text>
  </g>
</svg>
